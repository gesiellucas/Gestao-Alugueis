name: Build & Deploy macOS
on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate macOS icon (icon.icns)
        run: |
          python3 - <<'EOF'
          import struct, zlib, os

          def make_png(path, width, height, r, g, b):
              def chunk(tag, data):
                  c = tag + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              raw = b''.join(b'\x00' + bytes([r, g, b] * width) for _ in range(height))
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              with open(path, 'wb') as f:
                  f.write(sig + ihdr + idat + iend)

          iconset = 'resources/icon.iconset'
          os.makedirs(iconset, exist_ok=True)
          sizes = [16, 32, 64, 128, 256, 512]
          for s in sizes:
              make_png(f'{iconset}/icon_{s}x{s}.png', s, s, 59, 130, 246)
              make_png(f'{iconset}/icon_{s}x{s}@2x.png', s * 2, s * 2, 59, 130, 246)
          EOF
          iconutil --convert icns resources/icon.iconset --output resources/icon.icns

      - name: Build Application
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable code signing — no certificate configured yet
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run electron:build -- --mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-distribution
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7
